name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/auth-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/auth-service/go.mod
      - run: go vet ./...
      - run: go test ./...

  gosec:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/auth-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/auth-service/go.mod
      - run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
      - run: $(go env GOPATH)/bin/gosec ./...

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # gitleaks needs this to comment on PRs
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
